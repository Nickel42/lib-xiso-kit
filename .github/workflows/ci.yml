name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # .NET 8 runtime for the net8.0 test run; the .NET 10 SDK builds everything.
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build lib-xiso-kit.sln -c Release
      - name: Test (net8.0 and net10.0)
        run: dotnet test lib-xiso-kit.sln -c Release --no-build --logger "trx;LogFilePrefix=${{ matrix.os }}"
      - name: CLI self-test (synthetic disc, every format)
        shell: bash
        run: dotnet tools/lib-xiso-kit.Cli/bin/Release/net10.0/xiso-kit.dll selftest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  android:
    name: Android app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the Android workload
        run: dotnet workload install android
      - name: Build (Release, trimmed)
        run: dotnet build samples/AndroidSmoke/AndroidSmoke.csproj -c Release

  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack the library and the xiso-kit tool
        run: dotnet pack lib-xiso-kit.sln -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
